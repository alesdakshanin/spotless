schema: spec-driven

context: |
  App: Spotless — a browser-based utility that scans a user's Spotify library
  and playlists for unplayable songs, helps find replacements via Spotify Search,
  and lets users remove dead tracks and add replacements.

  Tech stack:
    - Vite + TypeScript
    - Preact + @preact/signals for interactive UI (island architecture)
    - Vitest for testing
    - Tailwind CSS
    - Spotify Web API with Authorization Code + PKCE (no backend)
    - Hosted on GitHub Pages

  Conventions:
    - Core logic (auth, API, scanner) as pure functions / async — easy to test
    - Simple screens (login, scan, progress) use vanilla DOM rendering
    - Interactive components (triage view, playlist picker) use Preact islands


